<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Setu — Kisan se Bazaar tak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1E4D2E;
    --green-deep-dark:#123420;
    --green-leaf:#6FA84B;
    --green-leaf-light:#8FC468;
    --gold:#C99A2E;
    --gold-dark:#A87F1F;
    --bg:#FBFCF8;
    --bg-soft:#EEF5E9;
    --card:#FFFFFF;
    --text:#1B2B1E;
    --text-muted:#5C6B5E;
    --text-faint:#8B9A8C;
    --border:#DEE8D9;
    --error:#B3261E;
    --error-bg:#FBEAE9;
    --shadow-sm: 0 1px 2px rgba(20,40,25,0.06);
    --shadow-md: 0 6px 20px rgba(20,40,25,0.10);
    --shadow-lg: 0 16px 40px rgba(20,40,25,0.16);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 22px;
    --font-head: 'Fraunces', serif;
    --font-body: 'Manrope', sans-serif;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1912;
      --bg-soft:#152219;
      --card:#16241A;
      --text:#EAF2E7;
      --text-muted:#A9BDA9;
      --text-faint:#7C9080;
      --border:#28392C;
      --error-bg:#3A1C1B;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1912;
    --bg-soft:#152219;
    --card:#16241A;
    --text:#EAF2E7;
    --text-muted:#A9BDA9;
    --text-faint:#7C9080;
    --border:#28392C;
    --error-bg:#3A1C1B;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:var(--font-head); margin:0; font-weight:600; letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:var(--font-body); cursor:pointer;}
  input{font-family:var(--font-body);}
  a{color:inherit;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  *:focus-visible{outline:2.5px solid var(--gold); outline-offset:2px; border-radius:4px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 22px; border-radius:12px; font-weight:700; font-size:15.5px;
    border:1.5px solid transparent; transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--green-deep); color:#fff; box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--green-deep-dark); box-shadow:var(--shadow-md);}
  .btn-primary:disabled{background:#9FB39F; cursor:not-allowed; box-shadow:none;}
  .btn-gold{background:var(--gold); color:#2A1F00;}
  .btn-gold:hover{background:var(--gold-dark);}
  .btn-ghost{background:transparent; color:var(--green-deep); border-color:var(--border);}
  .btn-ghost:hover{background:var(--bg-soft);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 14px; font-size:13.5px; border-radius:9px;}

  /* ---------- Login Page ---------- */
  .login-wrap{
    min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr;
  }
  @media (max-width:880px){ .login-wrap{grid-template-columns:1fr;} .login-visual{min-height:260px;} }

  .login-visual{
    position:relative; overflow:hidden;
    background:linear-gradient(165deg, #2C5C38 0%, #1E4D2E 55%, #123420 100%);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:48px 48px;
    color:#fff;
  }
  .login-visual svg{position:absolute; inset:0; width:100%; height:100%;}
  .login-brand{position:relative; z-index:2; display:flex; align-items:center; gap:12px;}
  .login-brand .mark{
    width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,0.14);
    display:flex;align-items:center;justify-content:center; font-size:22px;
    border:1px solid rgba(255,255,255,0.25);
  }
  .login-brand .word{font-family:var(--font-head); font-size:22px; font-weight:600;}
  .login-brand .tag{font-size:12.5px; opacity:0.85; margin-top:1px;}

  .login-visual-copy{position:relative; z-index:2;}
  .login-visual-copy h1{font-size:clamp(30px,3.6vw,42px); line-height:1.12; font-weight:600; max-width:9.5em;}
  .login-visual-copy .hindi{
    margin-top:18px; font-size:17px; color:#EAF2DE; opacity:0.92; font-weight:500;
  }
  .login-visual-foot{position:relative; z-index:2; display:flex; gap:28px; font-size:13px; opacity:0.8;}

  .login-panel{
    display:flex; align-items:center; justify-content:center; padding:40px 28px; background:var(--bg);
  }
  .login-card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-l); box-shadow:var(--shadow-md); padding:38px 34px;
  }
  .login-card h2{font-size:25px;}
  .login-card .sub{color:var(--text-muted); margin-top:6px; font-size:14.5px;}

  .field{margin-top:20px;}
  .field label{display:block; font-size:13.5px; font-weight:700; margin-bottom:7px; color:var(--text);}
  .input-shell{
    display:flex; align-items:center; border:1.5px solid var(--border); border-radius:11px;
    background:var(--bg); transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-shell:focus-within{border-color:var(--green-leaf); box-shadow:0 0 0 3px rgba(111,168,75,0.16);}
  .input-shell.err{border-color:var(--error); box-shadow:0 0 0 3px rgba(179,38,30,0.10);}
  .input-shell .prefix{padding:0 4px 0 14px; color:var(--text-muted); font-weight:700; font-size:15px;}
  .input-shell input{
    flex:1; border:none; background:transparent; padding:13px 14px 13px 6px; font-size:15.5px;
    color:var(--text); outline:none; min-width:0;
  }
  .input-shell .eye{background:none; border:none; padding:0 14px; color:var(--text-muted); display:flex; align-items:center;}
  .field-error{color:var(--error); font-size:13px; margin-top:6px; font-weight:600; display:flex; gap:6px; align-items:center;}
  .row-between{display:flex; align-items:center; justify-content:space-between; margin-top:18px; font-size:13.5px;}
  .checkline{display:flex; align-items:center; gap:8px; color:var(--text-muted);}
  .checkline input{accent-color:var(--green-deep); width:15px; height:15px;}
  .link{color:var(--green-deep); font-weight:700; text-decoration:none;}
  .link:hover{text-decoration:underline;}

  .banner{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px;
    font-size:13.5px; font-weight:600; margin-top:18px;
  }
  .banner.error{background:var(--error-bg); color:var(--error);}
  .banner.success{background:#E7F4E0; color:var(--green-deep-dark);}

  .divider-or{display:flex; align-items:center; gap:12px; margin:22px 0 18px; color:var(--text-faint); font-size:12.5px; font-weight:700;}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}

  .otp-toggle{
    width:100%; padding:13px 16px; border-radius:11px; border:1.5px dashed var(--green-leaf);
    background:var(--bg-soft); color:var(--green-deep-dark); font-weight:700; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .otp-toggle:hover{background:#E4F0DB;}

  .register-line{text-align:center; margin-top:22px; font-size:14px; color:var(--text-muted);}

  .otp-boxes{display:flex; gap:10px; margin-top:8px;}
  .otp-boxes input{
    width:100%; aspect-ratio:1; text-align:center; font-size:20px; font-weight:700;
    border:1.5px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); outline:none;
  }
  .otp-boxes input:focus{border-color:var(--green-leaf); box-shadow:0 0 0 3px rgba(111,168,75,0.16);}

  .success-screen{text-align:center; padding:20px 4px 4px;}
  .success-check{
    width:64px;height:64px;border-radius:50%; background:#E7F4E0; color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:30px;
  }

  /* ---------- App shell (post-login) ---------- */
  .header{
    position:sticky; top:0; z-index:40; background:var(--card); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:68px;
  }
  .header-left{display:flex; align-items:center; gap:34px;}
  .brand-mini{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand-mini .mark{
    width:36px;height:36px;border-radius:9px;background:var(--green-deep); color:#fff;
    display:flex;align-items:center;justify-content:center; font-size:18px;
  }
  .brand-mini .txt .word{font-family:var(--font-head); font-weight:600; font-size:17px; line-height:1.1;}
  .brand-mini .txt .tag{font-size:10.5px; color:var(--text-muted); font-weight:600;}

  .nav-links{display:flex; align-items:center; gap:4px;}
  .nav-links a{
    padding:9px 14px; border-radius:9px; font-weight:700; font-size:14px; color:var(--text-muted);
    text-decoration:none; cursor:pointer;
  }
  .nav-links a.active{color:var(--green-deep); background:var(--bg-soft);}
  .nav-links a:hover{color:var(--green-deep);}
  @media (max-width:860px){ .nav-links{display:none;} }

  .header-right{display:flex; align-items:center; gap:16px;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px; border:1px solid var(--border); background:var(--bg);
    display:flex; align-items:center; justify-content:center; position:relative; color:var(--text-muted);
  }
  .icon-btn .dot{position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--gold); border:1.5px solid var(--card);}
  .profile-wrap{position:relative;}
  .profile-btn{display:flex; align-items:center; gap:9px; background:none; border:none; padding:4px 6px 4px 4px; border-radius:10px;}
  .profile-btn:hover{background:var(--bg-soft);}
  .avatar{
    width:34px;height:34px;border-radius:50%; background:var(--green-leaf); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px;
  }
  .profile-btn .pname{font-weight:700; font-size:13.5px;}
  .profile-menu{
    position:absolute; right:0; top:calc(100% + 10px); width:210px; background:var(--card);
    border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-md); padding:8px;
    display:none; z-index:50;
  }
  .profile-menu.open{display:block;}
  .profile-menu button{
    width:100%; text-align:left; background:none; border:none; padding:10px 12px; border-radius:8px;
    font-size:13.8px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:10px;
  }
  .profile-menu button:hover{background:var(--bg-soft);}
  .profile-menu .sep{height:1px; background:var(--border); margin:6px 4px;}
  .profile-menu button.danger{color:var(--error);}

  main{flex:1; width:100%;}
  .shell{max-width:1180px; margin:0 auto; padding:36px 28px 80px;}
  @media (max-width:640px){ .shell{padding:22px 16px 60px;} }

  .page-head{margin-bottom:28px;}
  .page-head h1{font-size:26px;}
  .page-head p{color:var(--text-muted); margin-top:6px; font-size:14.5px;}

  /* ---------- Dashboard ---------- */
  .hero-card{
    background:linear-gradient(120deg, var(--green-deep) 0%, #2E6440 100%);
    border-radius:var(--radius-l); padding:34px 32px; color:#fff; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .hero-card::after{
    content:""; position:absolute; right:-40px; bottom:-60px; width:220px; height:220px;
    background:radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
  }
  .hero-card h2{font-size:24px; max-width:11em; position:relative; z-index:1;}
  .hero-card p{margin-top:8px; opacity:0.88; font-size:14.5px; max-width:26em; position:relative; z-index:1;}
  .hero-card .btn{margin-top:18px; position:relative; z-index:1;}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:22px;}
  @media (max-width:700px){ .stat-grid{grid-template-columns:1fr;} }
  .stat-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:20px;
  }
  .stat-card .num{font-family:var(--font-head); font-size:26px; font-weight:600; color:var(--green-deep);}
  .stat-card .lbl{color:var(--text-muted); font-size:13.5px; margin-top:4px; font-weight:600;}

  .section-title{font-size:18px; margin:34px 0 14px;}

  .quick-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  @media (max-width:820px){ .quick-grid{grid-template-columns:repeat(2,1fr);} }
  .quick-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:20px;
    text-align:left; display:flex; flex-direction:column; gap:10px;
  }
  .quick-card:hover{border-color:var(--green-leaf); box-shadow:var(--shadow-sm);}
  .quick-card .ic{font-size:22px;}
  .quick-card .t{font-weight:700; font-size:14.5px;}
  .quick-card .d{font-size:12.5px; color:var(--text-muted);}

  /* ---------- Stepper ---------- */
  .stepper{display:flex; align-items:center; margin-bottom:32px; overflow-x:auto; padding-bottom:4px;}
  .step{display:flex; align-items:center; flex-shrink:0;}
  .step .circle{
    width:30px;height:30px;border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; border:2px solid var(--border); color:var(--text-faint); background:var(--card);
    flex-shrink:0;
  }
  .step.done .circle{background:var(--green-deep); border-color:var(--green-deep); color:#fff;}
  .step.active .circle{border-color:var(--green-deep); color:var(--green-deep); background:var(--bg-soft);}
  .step .lbl{font-size:12.5px; font-weight:700; color:var(--text-faint); margin-left:8px; white-space:nowrap;}
  .step.done .lbl, .step.active .lbl{color:var(--text);}
  .step-line{width:34px; height:2px; background:var(--border); margin:0 8px; flex-shrink:0;}
  .step-line.done{background:var(--green-deep);}

  /* ---------- Crop select ---------- */
  .crop-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  @media (max-width:760px){ .crop-grid{grid-template-columns:repeat(2,1fr);} }
  .crop-card{
    background:var(--card); border:2px solid var(--border); border-radius:var(--radius-m); padding:16px;
    text-align:left; position:relative; transition:transform .12s ease, box-shadow .12s ease;
  }
  .crop-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-sm);}
  .crop-card.selected{border-color:var(--green-deep); box-shadow:var(--shadow-md); transform:translateY(-3px);}
  .crop-card .check{
    position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%;
    background:var(--green-deep); color:#fff; display:none; align-items:center; justify-content:center; font-size:13px;
  }
  .crop-card.selected .check{display:flex;}
  .crop-emoji{
    width:100%; aspect-ratio:1; border-radius:11px; background:var(--bg-soft); display:flex; align-items:center;
    justify-content:center; font-size:40px; margin-bottom:12px;
  }
  .crop-name{font-weight:700; font-size:14.5px;}

  .qty-row{display:flex; gap:14px; margin-top:30px; flex-wrap:wrap;}
  .qty-field{flex:1; min-width:180px;}
  .unit-pills{display:flex; gap:8px; margin-top:8px;}
  .pill{
    padding:10px 16px; border-radius:10px; border:1.5px solid var(--border); font-weight:700; font-size:13.5px;
    background:var(--card); color:var(--text-muted);
  }
  .pill.active{background:var(--green-deep); border-color:var(--green-deep); color:#fff;}

  .form-actions{display:flex; justify-content:space-between; align-items:center; margin-top:34px; gap:12px;}

  /* ---------- Payment ---------- */
  .pay-card{
    max-width:520px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l);
    padding:32px; box-shadow:var(--shadow-sm);
  }
  .pay-amount{font-family:var(--font-head); font-size:44px; font-weight:600; color:var(--green-deep);}
  .pay-desc{color:var(--text-muted); font-size:14.5px; margin-top:8px;}
  .pay-options{display:flex; flex-direction:column; gap:10px; margin-top:24px;}
  .pay-opt{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border:1.5px solid var(--border);
    border-radius:12px; background:var(--card); text-align:left;
  }
  .pay-opt.selected{border-color:var(--green-deep); background:var(--bg-soft);}
  .pay-opt .ic{font-size:20px;}
  .pay-opt .t{font-weight:700; font-size:14.5px; flex:1;}
  .pay-opt .radio{width:18px;height:18px;border-radius:50%; border:2px solid var(--border); flex-shrink:0;}
  .pay-opt.selected .radio{border-color:var(--green-deep); background:radial-gradient(circle,var(--green-deep) 0 40%, transparent 42%);}
  .pay-note{
    display:flex; gap:10px; background:var(--bg-soft); border-radius:11px; padding:13px 14px; margin-top:22px;
    font-size:13px; color:var(--text-muted); line-height:1.5;
  }
  .secure-row{display:flex; align-items:center; gap:8px; margin-top:18px; font-size:12.5px; color:var(--text-faint); font-weight:600;}

  /* ---------- Booking slots ---------- */
  .booking-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media (max-width:760px){ .booking-grid{grid-template-columns:1fr;} }
  .cal-card, .slot-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:22px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-head .m{font-weight:700; font-size:15px;}
  .cal-nav{display:flex; gap:6px;}
  .cal-nav button{width:28px;height:28px;border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text-muted);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center;}
  .cal-grid .dow{font-size:11px; font-weight:700; color:var(--text-faint); padding-bottom:6px;}
  .cal-grid .day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px;
    font-size:13.5px; font-weight:600; border:1px solid transparent; color:var(--text);
  }
  .cal-grid .day.disabled{color:var(--text-faint); cursor:not-allowed;}
  .cal-grid .day.selectable:hover{background:var(--bg-soft);}
  .cal-grid .day.selected{background:var(--green-deep); color:#fff; font-weight:700;}
  .cal-grid .day.empty{visibility:hidden;}

  .slot-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .slot{
    padding:13px 10px; border-radius:10px; border:1.5px solid var(--border); font-weight:700; font-size:13.5px;
    background:var(--card); text-align:center; color:var(--text);
  }
  .slot.disabled{color:var(--text-faint); background:var(--bg-soft); border-style:dashed; cursor:not-allowed;}
  .slot.selected{background:var(--green-deep); border-color:var(--green-deep); color:#fff;}

  /* ---------- Confirmation ---------- */
  .confirm-wrap{max-width:520px; margin:0 auto; text-align:center;}
  .detail-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m); padding:22px 24px;
    margin-top:22px; text-align:left;
  }
  .detail-row{display:flex; justify-content:space-between; padding:10px 0; font-size:14.5px; border-bottom:1px dashed var(--border);}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--text-muted); font-weight:600;}
  .detail-row .v{font-weight:700;}
  .confirm-actions{display:flex; gap:12px; margin-top:26px;}
  @media (max-width:480px){ .confirm-actions{flex-direction:column;} }

  /* ---------- Tracking ---------- */
  .track-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-l); padding:28px;}
  .track-id{color:var(--text-muted); font-size:13.5px; font-weight:600; margin-top:4px;}

  .route-visual{
    display:flex; align-items:center; justify-content:space-between; margin:26px 0 8px; padding:20px 10px;
    background:var(--bg-soft); border-radius:var(--radius-m); overflow-x:auto;
  }
  .route-node{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:90px;}
  .route-node .ic{
    width:46px;height:46px;border-radius:50%; background:var(--card); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .route-node.active .ic{border-color:var(--green-deep); background:var(--green-deep); color:#fff;}
  .route-node.done .ic{border-color:var(--green-leaf); background:var(--green-leaf); color:#fff;}
  .route-node .t{font-size:12px; font-weight:700; text-align:center;}
  .route-track{flex:1; height:3px; background:var(--border); margin:0 -2px; position:relative; top:-19px; min-width:24px;}
  .route-track.done{background:var(--green-leaf);}

  .timeline{margin-top:30px;}
  .tl-item{display:flex; gap:16px; position:relative; padding-bottom:30px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:""; position:absolute; left:19px; top:40px; bottom:0; width:2px; background:var(--border);
  }
  .tl-item:last-child::before{display:none;}
  .tl-item.done::before{background:var(--green-leaf);}
  .tl-dot{
    width:40px;height:40px;border-radius:50%; background:var(--bg-soft); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; z-index:1;
  }
  .tl-item.done .tl-dot{background:var(--green-deep); border-color:var(--green-deep); color:#fff;}
  .tl-item.current .tl-dot{border-color:var(--green-deep); color:var(--green-deep); background:#fff;}
  .tl-body .t{font-weight:700; font-size:15px;}
  .tl-body .d{font-size:13px; color:var(--text-muted); margin-top:3px;}

  .empty-note{
    text-align:center; padding:60px 20px; color:var(--text-muted);
  }
  .empty-note .ic{font-size:36px; margin-bottom:10px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--green-deep-dark); color:#fff; padding:13px 20px; border-radius:11px; font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow-lg); z-index:200; transition:all .25s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer.appfoot{border-top:1px solid var(--border); padding:20px 28px; text-align:center; color:var(--text-faint); font-size:12.5px;}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ============ State ============ */
  var state = {
    view: "login",            // login | dashboard | select-crop | crop-details | payment | slot | confirm | track
    loginBusy: false,
    loginError: "",
    fieldErrors: {},
    mobile: "",
    password: "",
    remember: false,
    otpMode: false,
    otpDigits: ["","","","","",""],
    loginSuccessFlash: false,
    farmerName: "Ramesh Kumar",
    profileMenuOpen: false,
    redirectAfterLogin: null,

    crop: null,
    quantity: "",
    unit: "Quintal",
    payMethod: "upi",
    payBusy: false,
    calMonthOffset: 0,
    selectedDate: null,
    selectedSlot: null,
    booking: null,
    trackStage: 1
  };

  var AUTH_KEY = "kisan_setu_auth_v1";
  var BOOKING_KEY = "kisan_setu_booking_v1";

  function saveAuth(){
    try{ localStorage.setItem(AUTH_KEY, JSON.stringify({name: state.farmerName, mobile: state.mobile})); }catch(e){}
  }
  function loadAuth(){
    try{
      var raw = localStorage.getItem(AUTH_KEY);
      if(raw){ var d = JSON.parse(raw); return d; }
    }catch(e){}
    return null;
  }
  function clearAuth(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }

  function saveBooking(){
    try{ localStorage.setItem(BOOKING_KEY, JSON.stringify(state.booking)); }catch(e){}
  }
  function loadBooking(){
    try{
      var raw = localStorage.getItem(BOOKING_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }

  var CROPS = [
    {id:"wheat", name:"Wheat", hi:"गेहूं", emoji:"🌾"},
    {id:"rice", name:"Rice", hi:"चावल", emoji:"🌾"},
    {id:"maize", name:"Maize", hi:"मक्का", emoji:"🌽"},
    {id:"soybean", name:"Soybean", hi:"सोयाबीन", emoji:"🫘"},
    {id:"cotton", name:"Cotton", hi:"कपास", emoji:"☁️"},
    {id:"sugarcane", name:"Sugarcane", hi:"गन्ना", emoji:"🎋"},
    {id:"mustard", name:"Mustard", hi:"सरसों", emoji:"🌼"},
    {id:"tomato", name:"Tomato", hi:"टमाटर", emoji:"🍅"},
    {id:"onion", name:"Onion", hi:"प्याज", emoji:"🧅"}
  ];

  var PROTECTED = ["dashboard","select-crop","crop-details","payment","slot","confirm","track","profile"];

  var root = document.getElementById("root");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ============ Icons (inline SVG strings) ============ */
  function icon(name, size){
    size = size || 18;
    var s = 'width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
    var paths = {
      eye:'<circle cx="12" cy="12" r="3"></circle><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>',
      eyeOff:'<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61C3.87 8.3 2 12 2 12s3.5 7 10 7a9.35 9.35 0 0 0 5.39-1.61M2 2l20 20"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>',
      bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>',
      chevDown:'<polyline points="6 9 12 15 18 9"></polyline>',
      check:'<polyline points="20 6 9 17 4 12"></polyline>',
      user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>',
      list:'<line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>',
      pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle>',
      help:'<circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line>',
      logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>',
      arrowLeft:'<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
      arrowRight:'<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
      lock:'<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
      shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>',
      truck:'<rect x="1" y="6" width="15" height="12" rx="1"></rect><path d="M16 10h4l3 3v5h-7"></path><circle cx="5.5" cy="18.5" r="1.8"></circle><circle cx="17.5" cy="18.5" r="1.8"></circle>',
      store:'<path d="M3 9l1-5h16l1 5"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path>',
      coin:'<circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M9.5 9.5c0-1.4 1.2-2.5 2.5-2.5s2.5 1.1 2.5 2.4c0 3-5 1.6-5 4.6 0 1.3 1.2 2.5 2.5 2.5s2.5-1.1 2.5-2.5"></path>',
      alert:'<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>',
      plant:'<path d="M12 22V13"></path><path d="M12 13c0-4-3-7-7-7 0 4 3 7 7 7Z"></path><path d="M12 13c0-4 3-7 7-7 0 4-3 7-7 7Z"></path>',
      cal:'<rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>',
      wallet:'<path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"></path><path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2Z"></path><circle cx="16" cy="13.5" r="1.5"></circle>',
      bank:'<line x1="3" y1="21" x2="21" y2="21"></line><line x1="5" y1="21" x2="5" y2="10"></line><line x1="9" y1="21" x2="9" y2="10"></line><line x1="15" y1="21" x2="15" y2="10"></line><line x1="19" y1="21" x2="19" y2="10"></line><polygon points="12 3 21 9 3 9"></polygon>'
    };
    return '<svg '+s+' aria-hidden="true">'+(paths[name]||"")+'</svg>';
  }

  /* ============ Render root controller ============ */
  function render(){
    if(state.view === "login"){
      renderLogin();
    } else {
      renderApp();
    }
    attachGlobalHandlers();
  }

  /* ============ LOGIN VIEW ============ */
  function renderLogin(){
    var farmSvg =
      '<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">'+
        '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#3E7A4C" stop-opacity="0"/><stop offset="1" stop-color="#0E2A17" stop-opacity="0.55"/>'+
        '</linearGradient></defs>'+
        '<rect width="600" height="800" fill="url(#sky)"/>'+
        '<circle cx="470" cy="120" r="70" fill="#F4D06F" opacity="0.35"/>'+
        '<g opacity="0.9">'+
        genRows(0)+
        '</g>'+
        '<path d="M0 560 Q150 520 300 560 T600 555 V800 H0 Z" fill="#173F26" opacity="0.9"/>'+
        '<path d="M0 620 Q150 580 300 615 T600 605 V800 H0 Z" fill="#0F2C1B"/>'+
      '</svg>';

    root.innerHTML =
    '<div class="login-wrap">'+
      '<div class="login-visual">'+
        farmSvg+
        '<div class="login-brand">'+
          '<div class="mark">🌾</div>'+
          '<div><div class="word">Kisan Setu</div><div class="tag">Kisan se Bazaar tak</div></div>'+
        '</div>'+
        '<div class="login-visual-copy">'+
          '<h1>'+(state.otpMode ? "Login with OTP." : "Welcome back to your marketplace.")+'</h1>'+
          '<p class="hindi">"Aapki fasal, aapka bazaar, aapka behtar daam."</p>'+
        '</div>'+
        '<div class="login-visual-foot">'+
          '<span>50,000+ farmers</span><span>28 states</span><span>Verified buyers</span>'+
        '</div>'+
      '</div>'+
      '<div class="login-panel">'+
        '<div class="login-card">'+
          renderLoginCardBody()+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function genRows(seed){
    var out = "";
    for(var r=0;r<6;r++){
      var y = 600 + r*4;
      out += '<path d="M-20 '+ (700-r*22) +' Q300 '+ (680-r*22) +' 620 '+ (700-r*22) +'" stroke="#3E7A4C" stroke-width="3" fill="none" opacity="'+(0.5-r*0.05)+'"/>';
    }
    for(var i=0;i<14;i++){
      var x = 20 + i*44 + (i%2===0?6:0);
      var y = 470 + (i%3)*10;
      out += '<g transform="translate('+x+','+y+')" fill="#5B9E5E" opacity="0.85">'+
        '<path d="M0 40 C-10 20 -6 0 0 -10 C6 0 10 20 0 40 Z"/>'+
        '<path d="M0 40 C4 22 8 4 2 -8 C-2 4 -4 24 0 40 Z" fill="#4C8A4F"/>'+
      '</g>';
    }
    // sun rays / simple farmer silhouette
    out += '<g transform="translate(190,560)" fill="#0E2A17" opacity="0.85">'+
      '<circle cx="0" cy="-46" r="10"/>'+
      '<path d="M-4 -36 L4 -36 L7 -4 L10 30 L4 30 L1 -2 L-1 -2 L-4 30 L-10 30 L-7 -4 Z"/>'+
      '<path d="M-4 -30 L-22 -14 L-18 -8 L-2 -20 Z"/>'+
      '<path d="M4 -30 L20 -18 L16 -12 L2 -22 Z"/>'+
    '</g>';
    return out;
  }

  function renderLoginCardBody(){
    if(state.loginSuccessFlash){
      return '<div class="success-screen">'+
        '<div class="success-check">'+icon("check",30)+'</div>'+
        '<h2>Login successful. Welcome back!</h2>'+
        '<p class="sub" style="margin-top:10px;">Taking you to your dashboard…</p>'+
      '</div>';
    }

    if(state.otpMode){
      return renderOtpCard();
    }

    var mobErr = state.fieldErrors.mobile;
    var passErr = state.fieldErrors.password;

    var html = '';
    html += '<h2>Welcome to Kisan Setu</h2>';
    html += '<p class="sub">Login karke apni fasal ka safar shuru karein.</p>';

    if(state.loginError){
      html += '<div class="banner error">'+icon("alert",16)+'<span>'+esc(state.loginError)+'</span></div>';
    }

    html += '<form id="loginForm" novalidate>';
    html += '<div class="field">'+
      '<label for="mobileInput">Mobile Number</label>'+
      '<div class="input-shell'+(mobErr?" err":"")+'">'+
        '<span class="prefix">+91</span>'+
        '<input id="mobileInput" name="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="98765 43210" value="'+esc(state.mobile)+'" autocomplete="tel-national">'+
      '</div>';
    if(mobErr) html += '<div class="field-error">'+icon("alert",14)+esc(mobErr)+'</div>';
    html += '</div>';

    html += '<div class="field">'+
      '<label for="passInput">Password</label>'+
      '<div class="input-shell'+(passErr?" err":"")+'">'+
        '<input id="passInput" name="password" type="'+(state.showPassword?"text":"password")+'" placeholder="Enter your password" value="'+esc(state.password)+'" autocomplete="current-password">'+
        '<button type="button" class="eye" id="togglePass" aria-label="Show password">'+icon(state.showPassword?"eyeOff":"eye",18)+'</button>'+
      '</div>';
    if(passErr) html += '<div class="field-error">'+icon("alert",14)+esc(passErr)+'</div>';
    html += '</div>';

    html += '<div class="row-between">'+
      '<label class="checkline"><input type="checkbox" id="rememberBox" '+(state.remember?"checked":"")+'> Remember me</label>'+
      '<a class="link" id="forgotLink" href="javascript:void(0)">Forgot Password?</a>'+
    '</div>';

    html += '<button type="submit" class="btn btn-primary btn-block" id="loginSubmit" style="margin-top:24px;" '+(state.loginBusy?"disabled":"")+'>'+
      (state.loginBusy ? spinnerSvg()+' Logging in...' : "Login")+
    '</button>';
    html += '</form>';

    html += '<div class="register-line">Don\'t have an account? <a class="link" id="registerLink" href="javascript:void(0)">Register Now</a></div>';

    html += '<div class="divider-or">OR</div>';
    html += '<button type="button" class="otp-toggle" id="otpToggle">'+icon("shield",17)+' Login with OTP</button>';

    return html;
  }

  function renderOtpCard(){
    var html = '';
    html += '<button type="button" class="btn-ghost btn-sm" id="backFromOtp" style="border:none; padding:0; margin-bottom:16px; display:inline-flex; gap:6px;">'+icon("arrowLeft",15)+' Back to password login</button>';
    html += '<h2>Login with OTP</h2>';
    html += '<p class="sub">We\'ll send a 6-digit code to your mobile number.</p>';

    if(!state.otpSent){
      var mobErr = state.fieldErrors.otpMobile;
      html += '<div class="field">'+
        '<label for="otpMobileInput">Mobile Number</label>'+
        '<div class="input-shell'+(mobErr?" err":"")+'">'+
          '<span class="prefix">+91</span>'+
          '<input id="otpMobileInput" type="tel" inputmode="numeric" maxlength="10" placeholder="98765 43210" value="'+esc(state.mobile)+'">'+
        '</div>';
      if(mobErr) html += '<div class="field-error">'+icon("alert",14)+esc(mobErr)+'</div>';
      html += '</div>';
      html += '<button type="button" class="btn btn-primary btn-block" id="sendOtpBtn" style="margin-top:22px;" '+(state.loginBusy?"disabled":"")+'>'+
        (state.loginBusy ? spinnerSvg()+" Sending..." : "Send OTP")+'</button>';
    } else {
      html += '<div class="banner success">'+icon("check",16)+'<span>OTP sent to +91 '+esc(state.mobile)+'</span></div>';
      html += '<div class="field"><label>Enter 6-digit OTP</label><div class="otp-boxes">';
      for(var i=0;i<6;i++){
        html += '<input class="otpDigit" data-idx="'+i+'" type="text" inputmode="numeric" maxlength="1" value="'+esc(state.otpDigits[i])+'">';
      }
      html += '</div>';
      if(state.fieldErrors.otp) html += '<div class="field-error">'+icon("alert",14)+esc(state.fieldErrors.otp)+'</div>';
      html += '</div>';
      html += '<button type="button" class="btn btn-primary btn-block" id="verifyOtpBtn" style="margin-top:22px;" '+(state.loginBusy?"disabled":"")+'>'+
        (state.loginBusy ? spinnerSvg()+" Verifying..." : "Verify & Login")+'</button>';
      html += '<div class="register-line">Didn\'t get the code? <a class="link" id="resendOtp" href="javascript:void(0)">Resend OTP</a></div>';
    }
    return html;
  }

  function spinnerSvg(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px;margin-right:2px;">'+
      '<circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none"/>'+
      '<path d="M21 12a9 9 0 0 0-9-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round">'+
      '<animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.7s" repeatCount="indefinite"/>'+
      '</path></svg>';
  }

  /* ============ APP SHELL (post-login) ============ */
  function renderApp(){
    var navItems = [
      {id:"dashboard", label:"Home"},
      {id:"select-crop", label:"Sell Crops"},
      {id:"track", label:"Track Crops"},
      {id:"support", label:"Support"},
      {id:"about", label:"About Us"}
    ];
    var navHtml = navItems.map(function(n){
      var active = (n.id === state.view) || (n.id==="select-crop" && ["select-crop","crop-details","payment","slot","confirm"].indexOf(state.view)>-1);
      return '<a data-nav="'+n.id+'" class="'+(active?"active":"")+'">'+n.label+'</a>';
    }).join("");

    var initials = state.farmerName.split(" ").map(function(s){return s[0];}).join("").slice(0,2).toUpperCase();

    var header =
    '<header class="header">'+
      '<div class="header-left">'+
        '<div class="brand-mini" data-nav="dashboard">'+
          '<div class="mark">🌾</div>'+
          '<div class="txt"><div class="word">Kisan Setu</div><div class="tag">Kisan se Bazaar tak</div></div>'+
        '</div>'+
        '<nav class="nav-links">'+navHtml+'</nav>'+
      '</div>'+
      '<div class="header-right">'+
        '<button class="icon-btn" aria-label="Notifications" id="notifBtn">'+icon("bell",18)+'<span class="dot"></span></button>'+
        '<div class="profile-wrap">'+
          '<button class="profile-btn" id="profileBtn">'+
            '<div class="avatar">'+initials+'</div>'+
            '<span class="pname">'+esc(state.farmerName.split(" ")[0])+'</span>'+
            icon("chevDown",15)+
          '</button>'+
          '<div class="profile-menu'+(state.profileMenuOpen?" open":"")+'" id="profileMenu">'+
            '<button data-nav="profile">'+icon("user",16)+' My Profile</button>'+
            '<button data-nav="track">'+icon("list",16)+' My Bookings</button>'+
            '<button data-nav="track">'+icon("pin",16)+' Track My Crop</button>'+
            '<button data-nav="support">'+icon("help",16)+' Help &amp; Support</button>'+
            '<div class="sep"></div>'+
            '<button class="danger" id="logoutBtn">'+icon("logout",16)+' Logout</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</header>';

    var body = "";
    switch(state.view){
      case "dashboard": body = viewDashboard(); break;
      case "select-crop": body = viewSelectCrop(); break;
      case "crop-details": body = viewCropDetails(); break;
      case "payment": body = viewPayment(); break;
      case "slot": body = viewSlot(); break;
      case "confirm": body = viewConfirm(); break;
      case "track": body = viewTrack(); break;
      case "support": body = viewStub("Support", "Our team is here to help with bookings, payments, and crop pickup.", "help"); break;
      case "about": body = viewStub("About Kisan Setu", "Kisan Setu connects farmers directly to trusted buyers — fair prices, transparent tracking, on-time payments.", "plant"); break;
      case "profile": body = viewStub("My Profile", esc(state.farmerName)+" · +91 "+esc(state.mobile||"98765 43210"), "user"); break;
      default: body = viewDashboard();
    }

    root.innerHTML = header + '<main><div class="shell">'+body+'</div></main>'+
      '<footer class="appfoot">© 2026 Kisan Setu — Kisan se Bazaar tak</footer>';
  }

  function viewStub(title, desc, ic){
    return '<div class="empty-note">'+

  function stepperHtml(activeStep){
    var steps = ["Select Crop","Crop Details","Payment","Book Slot","Confirm"];
    var html = '<div class="stepper">';
    steps.forEach(function(label, i){
      var n = i+1;
      var cls = n<activeStep ? "done" : (n===activeStep ? "active" : "");
      html += '<div class="step '+cls+'">'+
        '<div class="circle">'+(n<activeStep ? icon("check",13) : n)+'</div>'+
        '<div class="lbl">'+label+'</div>'+
      '</div>';
      if(i < steps.length-1) html += '<div class="step-line '+(n<activeStep?"done":"")+'"></div>';
    });
    html += '</div>';
    return html;
  }

  function viewSlot(){
    var now = new Date();
    var view = new Date(now.getFullYear(), now.getMonth()+state.calMonthOffset, 1);
    var monthName = view.toLocaleString("en-US",{month:"long", year:"numeric"});
    var firstDow = view.getDay();
    var daysInMonth = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    var dowLabels = ["S","M","T","W","T","F","S"];

    var calCells = "";
    dowLabels.forEach(function(d){ calCells += '<div class="dow">'+d+'</div>'; });
    for(var i=0;i<firstDow;i++){ calCells += '<div class="day empty"></div>'; }
    for(var d=1; d<=daysInMonth; d++){
      var thisDate = new Date(view.getFullYear(), view.getMonth(), d);
      var isPast = thisDate < new Date(now.getFullYear(),now.getMonth(),now.getDate());
      var isSunday = thisDate.getDay()===0;
      var disabled = isPast || isSunday;
      var key = thisDate.toISOString().slice(0,10);
      var selected = state.selectedDate === key;
      calCells += '<div class="day '+(disabled?"disabled":"selectable")+(selected?" selected":"")+'" '+(disabled?'':'data-date="'+key+'"')+'>'+d+'</div>';
    }

    var slots = ["09:00 AM","10:00 AM","11:00 AM","01:00 PM","02:00 PM","03:00 PM"];
    var unavailable = {"11:00 AM":1, "02:00 PM":1};
    var slotsHtml = slots.map(function(s){
      var dis = !!unavailable[s];
      var sel = state.selectedSlot === s;
      return '<button class="slot'+(dis?" disabled":"")+(sel?" selected":"")+'" '+(dis?"disabled":'data-slot="'+s+'"')+'>'+s+(dis?'<div style="font-size:10.5px;font-weight:600;opacity:0.7;">Unavailable</div>':'')+'</button>';
    }).join("");

    var canConfirm = state.selectedDate && state.selectedSlot;

    return stepperHtml(4)+
    '<div class="page-head"><h1>Book your selling slot</h1><p>Pick a date and time to bring your crop to the market.</p></div>'+
    '<div class="booking-grid">'+

        '<div class="cal-nav"><button id="prevMonth" '+(state.calMonthOffset<=0?"disabled":"")+'>'+icon("arrowLeft",14)+'</button><button id="nextMonth">'+icon("arrowRight",14)+'</button></div></div>'+
        '<div class="cal-grid">'+calCells+'</div>'+
      '</div>'+
      '<div class="slot-card">'+
        '<div class="cal-head"><span class="m">Available time slots</span></div>'+
        '<div class="slot-grid">'+slotsHtml+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="form-actions">'+
      '<button class="btn btn-ghost" id="backToPayment">'+icon("arrowLeft",16)+' Back</button>'+
      '<button class="btn btn-primary" id="confirmBookingBtn" '+(canConfirm?"":"disabled")+'>Confirm Booking</button>'+

  function setState(patch){

  function goTo(view){
    if(PROTECTED.indexOf(view) > -1){
      var auth = loadAuth();

        state.redirectAfterLogin = view;
        state.view = "login";
        render();

    state.profileMenuOpen = false;

    window.scrollTo(0,0);

  function validateLoginFields(mobile, password){
    var errs = {};
    if(!mobile){ errs.mobile = "Please enter your mobile number."; }
    else if(!/^[6-9]\d{9}$/.test(mobile)){ errs.mobile = "Enter a valid 10-digit mobile number."; }
    if(!password){ errs.password = "Please enter your password."; }
    return errs;
  }

        });

  function attachLoginHandlers(){
    if(state.loginSuccessFlash) return;

    if(state.otpMode){
      var backBtn = root.querySelector("#backFromOtp");
      if(backBtn) backBtn.addEventListener("click", function(){
        setState({otpMode:false, otpSent:false, fieldErrors:{}, loginError:""});
      });

      if(!state.otpSent){
        var sendBtn = root.querySelector("#sendOtpBtn");
        if(sendBtn) sendBtn.addEventListener("click", function(){
          var mobInput = root.querySelector("#otpMobileInput");
          var mobile = mobInput.value.trim();
          var errs = {};
          if(!mobile) errs.otpMobile = "Please enter your mobile number.";
          else if(!/^[6-9]\d{9}$/.test(mobile)) errs.otpMobile = "Enter a valid 10-digit mobile number.";
          if(Object.keys(errs).length){ setState({fieldErrors:errs}); return; }
          state.mobile = mobile;
          state.loginBusy = true;
          state.fieldErrors = {};
          render();
          setTimeout(function(){
            state.loginBusy = false;
            state.otpSent = true;
            render();
            showToast("OTP sent (demo): 123456");
          }, 900);
        });
      } else {
        var digitInputs = root.querySelectorAll(".otpDigit");
        Array.prototype.forEach.call(digitInputs, function(inp){
          inp.addEventListener("input", function(){
            var idx = parseInt(inp.getAttribute("data-idx"),10);
            var val = inp.value.replace(/\D/g,"").slice(0,1);
            state.otpDigits[idx] = val;
            if(val && digitInputs[idx+1]) digitInputs[idx+1].focus();
            render();
            setTimeout(function(){
              var next = root.querySelectorAll(".otpDigit")[Math.min(idx+ (val?1:0), 5)];
              if(next) next.focus();
            },0);
          });
          inp.addEventListener("keydown", function(e){
            var idx = parseInt(inp.getAttribute("data-idx"),10);
            if(e.key === "Backspace" && !inp.value && digitInputs[idx-1]){
              digitInputs[idx-1].focus();
            }
          });
        });
        var verifyBtn = root.querySelector("#verifyOtpBtn");
        if(verifyBtn) verifyBtn.addEventListener("click", function(){
          var code = state.otpDigits.join("");
          if(code.length < 6){ setState({fieldErrors:{otp:"Please enter the complete 6-digit OTP."}}); return; }
          state.loginBusy = true; state.fieldErrors = {};
          render();
          setTimeout(function(){
            state.loginBusy = false;
            if(code !== "123456"){
              setState({fieldErrors:{otp:"Incorrect OTP. Please try again. (Hint: 123456)"}});
              return;
            }
            completeLogin();
          }, 900);
        });
        var resend = root.querySelector("#resendOtp");
        if(resend) resend.addEventListener("click", function(){
          showToast("OTP resent (demo): 123456");
        });
      }
      return;
    }

    var form = root.querySelector("#loginForm");
    var mobileInput = root.querySelector("#mobileInput");
    var passInput = root.querySelector("#passInput");
    var togglePass = root.querySelector("#togglePass");
    var rememberBox = root.querySelector("#rememberBox");
    var otpToggle = root.querySelector("#otpToggle");
    var registerLink = root.querySelector("#registerLink");
    var forgotLink = root.querySelector("#forgotLink");

    if(mobileInput){
      mobileInput.addEventListener("input", function(){
        state.mobile = mobileInput.value.replace(/\D/g,"").slice(0,10);
        mobileInput.value = state.mobile;
      });
    }
    if(passInput){
      passInput.addEventListener("input", function(){ state.password = passInput.value; });
    }
    if(togglePass){
      togglePass.addEventListener("click", function(){
        state.showPassword = !state.showPassword;
        render();
        var pi = root.querySelector("#passInput");
        if(pi){ pi.focus(); pi.setSelectionRange(pi.value.length, pi.value.length); }
      });
    }
    if(rememberBox){
      rememberBox.addEventListener("change", function(){ state.remember = rememberBox.checked; });
    }
    if(otpToggle){
      otpToggle.addEventListener("click", function(){
        setState({otpMode:true, otpSent:false, fieldErrors:{}, loginError:""});
      });
    }
    if(registerLink){
      registerLink.addEventListener("click", function(){ showToast("Registration is coming soon."); });
    }
    if(forgotLink){
      forgotLink.addEventListener("click", function(){ showToast("Password reset link sent (demo)."); });
    }
    if(form){
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var mobile = state.mobile;
        var password = state.password;
        var errs = validateLoginFields(mobile, password);
        if(Object.keys(errs).length){
          setState({fieldErrors:errs, loginError:""});
          return;
        }
        state.fieldErrors = {};
        state.loginError = "";
        state.loginBusy = true;
        render();
        setTimeout(function(){
          state.loginBusy = false;
          // Demo credential check: any password "wrong" triggers error, else success
          if(password.toLowerCase() === "wrong"){
            setState({loginError:"Mobile number or password is incorrect."});
            return;
          }
          completeLogin();
        }, 1100);
      });
    }
  }

  function completeLogin(){
    saveAuth();
    state.loginSuccessFlash = true;
    render();
    setTimeout(function(){
      state.loginSuccessFlash = false;
      state.view = state.redirectAfterLogin || "dashboard";
      state.redirectAfterLogin = null;
      render();
    }, 1300);
  }

  function attachSlotHandlers(){
    Array.prototype.forEach.call(root.querySelectorAll("[data-date]"), function(el){
      el.addEventListener("click", function(){ setState({selectedDate: el.getAttribute("data-date")}); });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-slot]"), function(el){
      el.addEventListener("click", function(){ setState({selectedSlot: el.getAttribute("data-slot")}); });
    });
    var prev = root.querySelector("#prevMonth");
    if(prev) prev.addEventListener("click", function(){ if(state.calMonthOffset>0) setState({calMonthOffset: state.calMonthOffset-1}); });
    var next = root.querySelector("#nextMonth");
    if(next) next.addEventListener("click", function(){ setState({calMonthOffset: state.calMonthOffset+1}); });
    var back = root.querySelector("#backToPayment");
    if(back) back.addEventListener("click", function(){ goTo("payment"); });
    var confirmBtn = root.querySelector("#confirmBookingBtn");
    if(confirmBtn) confirmBtn.addEventListener("click", function(){
      if(!state.selectedDate || !state.selectedSlot) return;
      var cropObj = CROPS.filter(function(c){return c.id===state.crop;})[0] || CROPS[0];
      var bookingId = "AD-2026-" + String(Math.floor(10000+Math.random()*89999));
      state.booking = {
        id: bookingId,
        crop: state.crop,
        quantity: state.quantity || "50",
        unit: state.unit,
        date: state.selectedDate,
        slot: state.selectedSlot
      };
      state.trackStage = 1;
      saveBooking();
      goTo("confirm");
    });
  }

  function attachConfirmHandlers(){
    var viewDetails = root.querySelector("#viewDetailsBtn");
    if(viewDetails) viewDetails.addEventListener("click", function(){ showToast("Booking details are shown above."); });
  }

  function attachTrackHandlers(){
    var advance = root.querySelector("#advanceStage");
    if(advance) advance.addEventListener("click", function(){
      if(state.trackStage < 4){
        state.trackStage += 1;
        render();
        var labels = {2:"Crop picked up from farm.",3:"Crop arrived at market for inspection.",4:"Crop sold! Payment completed."};
        showToast(labels[state.trackStage] || "Status updated.");
      }
    });
  }

  /* ============ Init ============ */
  function init(){
    var auth = loadAuth();
    var existingBooking = loadBooking();
    if(existingBooking) state.booking = existingBooking;
    if(auth){
      state.mobile = auth.mobile || "";
      state.farmerName = auth.name || state.farmerName;
      state.view = "dashboard";
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
